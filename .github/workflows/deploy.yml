name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # (अगर आपकी डिफ़ॉल्ट ब्रांच master है तो इसे master कर दें)

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # जहाँ बिल्ड वेब फाइल्स मौजूद हैं
          branch: gh-pages # जिस ब्रांच पर गिट-पेजेस होस्ट होगा
